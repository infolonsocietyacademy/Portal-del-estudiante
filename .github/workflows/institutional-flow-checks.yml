name: Institutional Flow checks
on:
  pull_request:
    paths:
      - 'institutional-flow/**'
      - 'scripts/sync-institutional-flow.py'
      - 'tests/**'
      - 'index.html'
      - 'script.js'
      - 'admin-performance.js'
      - 'leaderboard.js'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'OLFX_DIAGNOSTICO_VPS.cmd'
      - 'diagnostico-vps/**'
      - 'scripts/build-vps-diagnostics.py'
      - '.github/workflows/institutional-flow-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 scripts/build-vps-diagnostics.py --check
      - run: node --check script.js && node --check institutional-flow/entry.mjs && node --check admin-billing.js && node --check billing/editor.js && node --check billing/invoice-pdf.js
