name: Breakout FakeBreakout M1 TP1 checks
on:
  push:
    branches: [olfx-mt5-bridge]
    paths: ['bridge/breakfake_m1/**', '.github/workflows/olfx-breakfake-checks.yml']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s bridge/breakfake_m1/tests -v
      - run: python -m compileall -q bridge/breakfake_m1/runtime
      - name: Parse owner PowerShell installer without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'bridge/breakfake_m1/recovery/INSTALAR_BREAK_FAKE.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
